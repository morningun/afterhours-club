<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>AFTERHOURS — 3D Club</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#04030a;overflow:hidden;color:#fff;
    font-family:"Helvetica Neue",Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;touch-action:none;overscroll-behavior:none}
  canvas{display:block}
  #app{position:fixed;inset:0}
  #ui{position:fixed;inset:0;pointer-events:none;touch-action:none}
  .brand{position:absolute;top:22px;left:24px;font-size:11px;font-weight:700;letter-spacing:.46em;opacity:.9}
  .brand em{display:block;font-style:normal;margin-top:7px;font-size:9px;letter-spacing:.2em;font-weight:400;color:#ff2e88}
  #sound{position:absolute;top:16px;right:16px;pointer-events:auto;padding:11px 16px;border-radius:999px;
    border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:#fff;
    font-size:10px;letter-spacing:.22em;cursor:pointer;transition:.25s;backdrop-filter:blur(10px)}
  #sound:hover{background:rgba(255,46,136,.22);border-color:rgba(255,46,136,.6)}
  #hint{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);font-size:11px;letter-spacing:.14em;
    color:rgba(255,255,255,.5);text-align:center;white-space:nowrap;transition:opacity 1.4s}
  #hint.hide{opacity:0}
  #dance{position:absolute;right:16px;bottom:34px;pointer-events:auto;padding:14px 22px;border-radius:999px;
    border:1px solid rgba(0,229,255,.45);background:rgba(0,229,255,.1);color:#7bf3ff;
    font-size:11px;font-weight:700;letter-spacing:.24em;cursor:pointer;transition:.22s;backdrop-filter:blur(10px)}
  #dance:hover{background:rgba(0,229,255,.22)}
  #dance.on{background:rgba(255,46,136,.24);border-color:rgba(255,46,136,.75);color:#ffd0e4;
    box-shadow:0 0 26px rgba(255,46,136,.6)}
  #stick{position:absolute;left:24px;bottom:34px;width:118px;height:118px;border-radius:50%;
    border:1px solid rgba(255,255,255,.16);pointer-events:auto;display:none;touch-action:none;
    background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.07),rgba(255,255,255,.015))}
  #knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;
    background:rgba(255,255,255,.6);box-shadow:0 0 24px rgba(255,46,136,.75)}
  @media (pointer:coarse){#stick{display:block}#hint{display:none}}
  #online{position:absolute;top:62px;left:24px;display:flex;align-items:center;gap:8px;
    padding:8px 14px;border-radius:999px;border:1px solid rgba(55,255,139,.32);
    background:rgba(10,255,150,.07);font-size:11px;letter-spacing:.06em;color:#c9ffe2;
    backdrop-filter:blur(10px);transition:.3s}
  #online.warn{border-color:rgba(255,209,102,.35);background:rgba(255,209,102,.08);color:#ffe9b0}
  #online.off{border-color:rgba(255,255,255,.16);background:rgba(255,255,255,.04);color:rgba(255,255,255,.55)}
  #online i{width:7px;height:7px;border-radius:50%;background:#37ff8b;box-shadow:0 0 10px #37ff8b;
    animation:dotPulse 1.8s ease-in-out infinite}
  #online.warn i{background:#ffd166;box-shadow:0 0 10px #ffd166}
  #online.off i{background:#888;box-shadow:none;animation:none}
  @keyframes dotPulse{0%,100%{opacity:.45;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
  #me{position:absolute;top:60px;right:16px;pointer-events:auto;display:flex;align-items:center;gap:8px;
    padding:9px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.05);color:#fff;font-size:11px;letter-spacing:.1em;cursor:pointer;
    transition:.22s;backdrop-filter:blur(10px);max-width:44vw}
  #me:hover{background:rgba(0,229,255,.16);border-color:rgba(0,229,255,.55)}
  #meDot{width:9px;height:9px;border-radius:50%;background:#ff2e88;box-shadow:0 0 10px currentColor;flex:0 0 auto}
  #meName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #panel{position:absolute;top:112px;right:16px;width:252px;pointer-events:auto;
    padding:16px;border-radius:18px;border:1px solid rgba(255,255,255,.16);
    background:rgba(10,7,20,.86);backdrop-filter:blur(18px);
    box-shadow:0 18px 50px rgba(0,0,0,.6);
    opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;transition:.2s ease}
  #panel.open{opacity:1;transform:none;pointer-events:auto}
  #panel h4{font-size:9px;letter-spacing:.28em;font-weight:700;color:rgba(255,255,255,.55);margin-bottom:8px}
  #nameInput{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.06);color:#fff;font-size:13px;font-family:inherit;outline:none}
  #nameInput:focus{border-color:rgba(0,229,255,.7);box-shadow:0 0 0 3px rgba(0,229,255,.12)}
  #swatches{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 16px}
  #swatches button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;
    cursor:pointer;padding:0;transition:.18s;outline:none}
  #swatches button:hover{transform:scale(1.12)}
  #swatches button.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
  #apply{width:100%;padding:11px;border-radius:10px;border:1px solid rgba(55,255,139,.5);
    background:rgba(55,255,139,.14);color:#b6ffd6;font-size:11px;font-weight:700;letter-spacing:.2em;
    cursor:pointer;transition:.2s;font-family:inherit}
  #apply:hover{background:rgba(55,255,139,.26)}
  #apply:disabled{opacity:.5;cursor:default}
  #panelMsg{font-size:10px;color:rgba(255,255,255,.5);margin-top:9px;min-height:12px;letter-spacing:.04em}
  #panelMsg.err{color:#ff9ab8}
  #app{opacity:0;transition:opacity 1.4s ease}
  #app.ready{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="ui">
  <div class="brand">AFTERHOURS<em>SEOUL · 02:47 AM</em></div>
  <div id="online"><i></i><span id="onlineText">연결 중…</span></div>
  <button id="sound">SOUND OFF</button>
  <button id="me"><i id="meDot"></i><span id="meName">나</span></button>
  <div id="panel">
    <h4>NICKNAME</h4>
    <input id="nameInput" type="text" maxlength="20" autocomplete="off" spellcheck="false" />
    <h4 style="margin-top:16px">OUTFIT</h4>
    <div id="swatches"></div>
    <button id="apply">변경</button>
    <div id="panelMsg"></div>
  </div>
  <div id="hint">드래그로 시점 · WASD 이동 · SHIFT 달리기 · F 춤추기</div>
  <button id="dance">DANCE</button>
  <div id="stick"><div id="knob"></div></div>
</div>
